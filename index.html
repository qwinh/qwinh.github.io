<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>full‑screen color + popup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #screen {
      height: 100vh;
      width: 100vw;
      background-color: rgb(0, 0, 0);
      transition: background-color 0.05s linear;
    }

    /* popup — transient, auto‑hides */
    #popup {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(6px);
      color: white;
      font-family: 'Segoe UI', Roboto, 'Fira Code', monospace;
      font-size: 1.5rem;
      padding: 0.9rem 2rem;
      border-radius: 4rem;
      border: 1px solid rgba(255, 255, 240, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.5px;
      pointer-events: none;
      /* allow clicks to pass through */
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      z-index: 1000;
    }

    #popup.show {
      opacity: 1;
    }

    #popup span {
      font-weight: 500;
      text-shadow: 0 2px 5px black;
    }

    #popup .mode-badge {
      background: #3a3a4e;
      padding: 0.2rem 0.8rem;
      border-radius: 3rem;
      font-size: 1rem;
      margin-left: 0.75rem;
      border: 1px solid #777792;
    }
  </style>
</head>

<body>
  <div id="screen"></div>
  <div id="popup">
    <span id="popup-color">rgb(0, 0, 0)</span>
    <span class="mode-badge" id="popup-mode">RED x=0</span>
  </div>

  <script>
    (function () {
      // ----- state -----
      let x = 0;               // 0 .. 255
      const MIN_X = 0;
      const MAX_X = 255;

      // mode: 0 = RED   (x,0,0)
      //       1 = GREEN (0,x,0)
      //       2 = BLUE  (0,0,x)
      let mode = 0;

      const screenEl = document.getElementById('screen');
      const popupEl = document.getElementById('popup');
      const popupColorSpan = document.getElementById('popup-color');
      const popupModeSpan = document.getElementById('popup-mode');

      let hideTimeout = null;

      // --- helper: format current color as RGB tuple + mode label ---
      function getRgbTuple() {
        switch (mode) {
          case 0: return [x, 0, 0];
          case 1: return [0, x, 0];
          case 2: return [0, 0, x];
          default: return [0, 0, 0];
        }
      }

      function getModeLabel() {
        return ['RED', 'GREEN', 'BLUE'][mode];
      }

      // --- show transient popup with current color info ---
      function showPopup() {
        const [r, g, b] = getRgbTuple();
        const rgbStr = `rgb(${r}, ${g}, ${b})`;
        const modeStr = `${getModeLabel()} x=${x}`;

        popupColorSpan.textContent = rgbStr;
        popupModeSpan.textContent = modeStr;

        // make popup visible
        popupEl.classList.add('show');

        // clear previous timeout to avoid premature hiding
        if (hideTimeout) {
          clearTimeout(hideTimeout);
        }

        // set new timeout to hide after 1 second
        hideTimeout = setTimeout(() => {
          popupEl.classList.remove('show');
          hideTimeout = null;
        }, 1000);
      }

      // --- update background and show popup ---
      function updateDisplay() {
        const [r, g, b] = getRgbTuple();
        screenEl.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        showPopup();   // popup will reflect current state
      }

      // --- intensity setters ---
      function setX(newX) {
        x = Math.min(MAX_X, Math.max(MIN_X, newX));
        updateDisplay();
      }

      function setMode(newMode) {
        mode = (newMode + 3) % 3;
        updateDisplay();
      }

      // --- keyboard handling (same as before) ---
      function handleKeyDown(e) {
        const key = e.key;
        if (key.startsWith('Arrow') || key === 'PageUp' || key === 'PageDown' || key === 'Home' || key === 'End') {
          e.preventDefault();
        }

        if (key === 'ArrowRight') setX(x + 1);
        else if (key === 'ArrowLeft') setX(x - 1);
        else if (key === 'PageUp') setX(x + 10);
        else if (key === 'PageDown') setX(x - 10);
        else if (key === 'Home') setX(MIN_X);
        else if (key === 'End') setX(MAX_X);
        else if (key === 'ArrowUp') setMode(mode + 1);
        else if (key === 'ArrowDown') setMode(mode - 1);
        else if (key === '1') setMode(0);
        else if (key === '2') setMode(1);
        else if (key === '3') setMode(2);
      }

      window.addEventListener('keydown', handleKeyDown);
      updateDisplay();   // initial black + popup
    })();
  </script>
</body>

</html>
